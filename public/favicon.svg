<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5d8f"/>
      <stop offset="1" stop-color="#1a3550"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="16" y="16" width="480" height="480" rx="104"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <!-- sfondo -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="240" fill="url(#shine)" clip-path="url(#clip)"/>
  <!-- collegamenti -->
  <g fill="none" stroke="#e6edf5" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 150 V178"/>
    <path d="M180 286 H124 V338"/>
    <path d="M332 286 H388 V338"/>
  </g>
  <g fill="#e6edf5">
    <path d="M256 196 l-17 -22 h34 z"/>
    <path d="M124 356 l-17 -22 h34 z"/>
    <path d="M388 356 l-17 -22 h34 z"/>
  </g>
  <!-- forme -->
  <g filter="url(#sh)" stroke-width="10" stroke-linejoin="round">
    <rect x="176" y="76" width="160" height="74" rx="37" fill="#dae8fc" stroke="#9cc0ec"/>
    <path d="M256 200 L332 286 L256 372 L180 286 Z" fill="#ffd966" stroke="#f0bc2e"/>
    <rect x="60" y="358" width="128" height="74" rx="18" fill="#c9e7c6" stroke="#8fc78a"/>
    <rect x="324" y="358" width="128" height="74" rx="18" fill="#ffd9b0" stroke="#f0a95c"/>
  </g>
</svg>
