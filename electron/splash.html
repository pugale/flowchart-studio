<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Flowchart Studio</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; -webkit-app-region: drag; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      font-family: 'Segoe UI', Arial, sans-serif; color: #fff;
      background: linear-gradient(160deg, #2b5d8f 0%, #1a3550 100%);
      border: 1px solid #12283d; box-sizing: border-box;
    }
    img { width: 96px; height: 96px; filter: drop-shadow(0 6px 12px rgba(0,0,0,.35)); animation: pop .5s ease-out; }
    h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: .02em; }
    .ver { font-size: 12px; opacity: .7; margin-top: -8px; }
    .bar { width: 220px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); overflow: hidden; margin-top: 8px; }
    .bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 2px; background: #ffd966; animation: run 1.1s ease-in-out infinite; }
    .msg { font-size: 12px; opacity: .8; }
    @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <img src="../build/icon.png" alt="">
  <h1>Flowchart Studio</h1>
  <div class="ver" id="ver"></div>
  <div class="bar"></div>
  <div class="msg">Avvio in corso…</div>
  <script>
    const v = new URLSearchParams(location.search).get('v');
    if (v) document.getElementById('ver').textContent = 'Versione ' + v;
  </script>
</body>
</html>
